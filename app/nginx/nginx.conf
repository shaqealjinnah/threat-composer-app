server {
  listen 8080;
  server_name _;

  # Health check endpoint for ALB/ECS
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Serve React SPA
  location / {
    root /var/www/threat-composer;
    index index.html;
    try_files $uri /index.html;
  }
}